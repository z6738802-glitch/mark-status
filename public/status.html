<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>מצב פיתוח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f1; --surface:#ffffff; --tint:#f6f9f8;
  --ink:#22313a; --muted:#66767e; --line:#dde6e3; --line-2:#c9d5d1;
  --accent:#2d7f86;
  --work:#3a78b5; --work-soft:#e7f0f8;
  --wait:#a97a22; --wait-soft:#f8f1e1;
  --block:#bd5446; --block-soft:#f9ebe8;
  --done:#3e8e63; --done-soft:#e6f3ec;
}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;direction:rtl;text-align:right;background:var(--bg);color:var(--ink);
  font-family:'Heebo',system-ui,Arial,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1120px;margin:0 auto;padding:48px 24px 72px}

/* ── כותרת ומסילת התקדמות ── */
header{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 32px 26px;margin-bottom:28px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
h1{font-size:clamp(26px,3.6vw,36px);font-weight:800;letter-spacing:-.015em;line-height:1.15;margin:0 0 6px}
.sub{margin:0;color:var(--muted);font-size:17px;font-weight:400}
.meta{display:grid;gap:2px;font-size:14px;color:var(--muted);text-align:left}
.meta b{color:var(--ink);font-weight:500}
.pct{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.pct strong{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.pct span{color:var(--muted);font-size:15px}
.track{display:flex;gap:4px;height:14px}
.seg{flex:1;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.seg i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px}
.seg.work i{background:var(--work)} .seg.wait i{background:var(--wait)}
.seg.block i{background:var(--block)} .seg.done i{background:var(--done)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:14px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ── כרטיסים ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px 16px;
  display:flex;flex-direction:column;box-shadow:inset -4px 0 0 var(--c)}
.card.work{--c:var(--work);--s:var(--work-soft)} .card.wait{--c:var(--wait);--s:var(--wait-soft)}
.card.block{--c:var(--block);--s:var(--block-soft)} .card.done{--c:var(--done);--s:var(--done-soft)}
.ct{display:flex;gap:12px;align-items:flex-start}
.ico{width:38px;height:38px;border-radius:10px;background:var(--s);color:var(--c);display:grid;place-items:center;flex:none}
.ct h2{margin:0;font-size:18px;font-weight:700;line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:13.5px;font-weight:500;color:var(--c)}
.pill svg{width:14px;height:14px;stroke-width:2.4}
.desc{margin:14px 0 0;color:var(--muted);font-size:15.5px}
.blocker{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:var(--block-soft);color:#7d3328;font-size:15px;display:flex;gap:9px}
.blocker svg{color:var(--block);margin-top:3px;width:16px;height:16px}
ul.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
ul.steps li{display:flex;gap:9px;font-size:15px;align-items:flex-start}
ul.steps li svg{width:16px;height:16px;margin-top:4px;color:var(--line-2)}
ul.steps li.ok{color:var(--muted)}
ul.steps li.ok svg{color:var(--done)}
.mini{margin-top:12px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);border-radius:3px}
.cf{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.cf .who{color:var(--ink);font-weight:500}
.cf-wrap{margin-top:16px;border-top:1px solid var(--line)}

/* ── פאנלים ── */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.panel h3{margin:0 0 14px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px}
.panel h3 svg{color:var(--accent)}
.qs{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.qs b{display:block;font-weight:500}
.qs span{color:var(--muted);font-size:15px}
.hist{margin:0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.state{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:70px 24px;text-align:center;color:var(--muted)}
.state svg{width:34px;height:34px;color:var(--line-2);margin-bottom:10px}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:760px){
  .wrap{padding:24px 14px 48px} header{padding:22px 20px}
  .meta{text-align:right}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="wrap" id="root"><div class="state">טוען את מצב העבודה</div></main>
<script src="/icons.js"></script>
<script>
const I = MS_ICONS, S = MS_STATUS, svg = msSvg, esc = msEsc;
const fmt = d => d ? new Date(d).toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
const fmtShort = d => d ? new Date(d).toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' }) : '';
const CHECK = '<path d="M20 6 9 17l-5-5"/>', DOT = '<circle cx="12" cy="12" r="8"/>';
const ALERT = '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>';

// התקדמות של כרטיס: הושלם = 100%, אחרת לפי שורות מסומנות
function progress(it) {
  if (it.status === 'done') return 1;
  const b = it.bullets || [];
  return b.length ? b.filter(x => x.done).length / b.length : 0;
}

function render({ client, items, questions, history }) {
  const total = items.length;
  const overall = total ? Math.round(items.reduce((s, i) => s + progress(i), 0) / total * 100) : 0;
  const count = k => items.filter(i => i.status === k).length;

  const segs = items.map(it =>
    `<div class="seg ${it.status}" title="${esc(it.title)}"><i style="width:${Math.max(progress(it) * 100, it.status === 'done' ? 100 : 8)}%"></i></div>`).join('');

  const legend = ['done', 'work', 'wait', 'block'].filter(k => count(k))
    .map(k => `<span><i style="background:var(--${k})"></i>${S[k].he} ${count(k)}</span>`).join('');

  const cards = items.map(it => {
    const b = it.bullets || [];
    const done = b.filter(x => x.done).length;
    return `<article class="card ${it.status}">
      <div class="ct">
        <div class="ico">${svg((I[it.icon] || I.circle).p)}</div>
        <div><h2>${esc(it.title)}</h2>
          <span class="pill">${svg(S[it.status].p)}${S[it.status].he}</span></div>
      </div>
      ${it.description ? `<p class="desc">${esc(it.description)}</p>` : ''}
      ${it.blocker ? `<div class="blocker">${svg(ALERT)}<span>${esc(it.blocker)}</span></div>` : ''}
      ${b.length ? `<ul class="steps">${b.map(x => `<li class="${x.done ? 'ok' : ''}">${svg(x.done ? CHECK : DOT)}<span>${esc(x.text)}</span></li>`).join('')}</ul>
        <div class="mini" title="${done} מתוך ${b.length}"><i style="width:${Math.round(progress(it) * 100)}%"></i></div>` : ''}
      ${(it.owner || it.stage) ? `<div class="cf-wrap"><div class="cf"><span class="who">${esc(it.owner || '')}</span><span>${esc(it.stage || '')}</span></div></div>` : ''}
    </article>`;
  }).join('');

  const qPanel = questions.length ? `<section class="panel"><h3>${svg('<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>')}מחכה להחלטה שלכם</h3>
    <ul class="qs">${questions.map(q => `<li><b>${esc(q.title)}</b>${q.body ? `<span>${esc(q.body)}</span>` : ''}</li>`).join('')}</ul></section>` : '';
  const hPanel = history.length ? `<section class="panel"><h3>${svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>')}מה השתנה לאחרונה</h3>
    <ul class="hist">${history.map(x => `<li><span>${esc(x.item_title || '')}: ${esc(x.change)}</span><time>${fmtShort(x.changed_at)}</time></li>`).join('')}</ul></section>` : '';

  document.getElementById('root').innerHTML = `
    <header>
      <div class="head">
        <div><h1>${esc(client.name)}</h1><p class="sub">${esc(client.subtitle || 'מצב העבודה על המערכת')}</p></div>
        <div class="meta"><span>עודכן <b>${fmt(client.updated_at)}</b></span><span>גרסה <b>${esc(client.version || '1.0')}</b></span></div>
      </div>
      ${total ? `<div class="pct"><strong>${overall}%</strong><span>התקדמות כוללת על ${total} נושאים</span></div>
      <div class="track">${segs}</div><div class="legend">${legend}</div>` : ''}
    </header>
    ${total ? `<div class="grid">${cards}</div>` : `<div class="state">עדיין אין נושאים להצגה</div>`}
    ${(qPanel || hPanel) ? `<div class="cols">${qPanel}${hPanel}</div>` : ''}
    <footer>MARK Automations</footer>`;
  document.title = `${client.name} | מצב העבודה`;
}

async function load() {
  const token = location.pathname.split('/').filter(Boolean).pop();
  try {
    const r = await fetch(`/api/status/${encodeURIComponent(token)}`, { cache: 'no-store' });
    if (!r.ok) throw 0;
    render(await r.json());
  } catch {
    document.getElementById('root').innerHTML = `<div class="state">${svg('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>')}<p>הקישור אינו פעיל. פנו אל MARK Automations לקבלת קישור מעודכן.</p></div>`;
  }
}
load();
// רענון שקט כל 5 דקות למי שמשאיר את העמוד פתוח
setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000);
</script>
</body>
</html>
