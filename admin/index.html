<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>ניהול עמודי סטטוס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f1; --surface:#fff; --tint:#f6f9f8; --ink:#22313a; --muted:#66767e;
  --line:#dde6e3; --line-2:#c9d5d1; --accent:#2d7f86; --accent-soft:#e3f0f0;
  --work:#3a78b5; --wait:#a97a22; --block:#bd5446; --done:#3e8e63;
}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;direction:rtl;text-align:right;background:var(--bg);color:var(--ink);
  font-family:'Heebo',system-ui,Arial,sans-serif;font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1040px;margin:0 auto;padding:32px 22px 80px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.bar h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.015em}
.bar .who{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.box h2{margin:0 0 14px;font-size:18px;font-weight:700}
button,.btn{font:inherit;font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#246a70;color:#fff}
button.ghost{border-color:transparent;background:transparent;padding:6px 8px}
button.danger:hover{border-color:var(--block);color:var(--block)}
button.sm,.btn.sm{padding:5px 10px;font-size:13.5px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px;border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--tint);color:var(--ink);direction:rtl;text-align:right}
textarea{min-height:72px;resize:vertical}
label{display:block;font-size:13.5px;font-weight:500;color:var(--muted);margin-bottom:5px}
.f{margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* לקוחות */
.clients{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--tint)}
.crow.off{opacity:.55}
.crow strong{font-size:16.5px}
.crow small{display:block;color:var(--muted);font-size:13.5px}
.bar-mini{height:5px;background:var(--line);border-radius:3px;margin-top:8px;max-width:240px;overflow:hidden}
.bar-mini i{display:block;height:100%;background:var(--done)}

/* כרטיסים */
.item{border:1px solid var(--line);border-radius:12px;background:var(--tint);margin-bottom:10px;box-shadow:inset -4px 0 0 var(--c,var(--line-2))}
.item.work{--c:var(--work)} .item.wait{--c:var(--wait)} .item.block{--c:var(--block)} .item.done{--c:var(--done)}
.ih{display:flex;align-items:center;gap:10px;padding:11px 12px}
.ih .t{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;background:none;border:0;padding:4px;font-weight:500;justify-content:flex-start;text-align:right}
.ih .t:hover{color:var(--ink)}
.ih .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ih .t svg{color:var(--c)}
.ih .st{font-size:13.5px;color:var(--c);font-weight:500;white-space:nowrap}
.ib{padding:4px 16px 16px;border-top:1px solid var(--line)}
.ib[hidden]{display:none}
.segbtn{display:flex;gap:6px;flex-wrap:wrap}
.segbtn button{flex:1;justify-content:center;min-width:90px}
.segbtn button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.segbtn button.work{--c:var(--work)} .segbtn button.wait{--c:var(--wait)} .segbtn button.block{--c:var(--block)} .segbtn button.done{--c:var(--done)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.icons button{flex-direction:column;gap:3px;padding:8px 4px;font-size:12.5px;justify-content:center}
.icons button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.bl{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.bl input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--done)}
.bl input[type=text]{flex:1}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{direction:ltr;text-align:left;font-size:14px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px}
.login{max-width:380px;margin:12vh auto 0}
.login h1{font-size:24px;margin:0 0 4px}
.login p{margin:0 0 18px;color:var(--muted)}
.err{background:#f9ebe8;color:#8a3a2f;padding:9px 12px;border-radius:9px;font-size:14px;margin-bottom:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:10px;font-size:14.5px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}.crow{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status"></div>
<script src="/icons.js"></script>
<script>
const I = MS_ICONS, S = MS_STATUS, svg = msSvg, esc = msEsc, $ = id => document.getElementById(id);
const UI = {
  plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  up: '<path d="m18 15-6-6-6 6"/>', down: '<path d="m6 9 6 6 6-6"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  back: '<path d="m9 18 6-6-6-6"/>', out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  refresh: '<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M3 21v-5h5"/>',
  trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  save: '<path d="M20 6 9 17l-5-5"/>',
};
let ME = null;

let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }
async function api(url, opt = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opt });
  if (r.status === 401 && !url.endsWith('/login')) { renderLogin(); throw new Error('401'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { toast(data.error || 'הפעולה נכשלה'); throw new Error(data.error); }
  return data;
}
const publicUrl = token => `${location.origin}/s/${token}`;
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('הקישור הועתק'); } catch { prompt('העתק את הקישור:', text); } }

// ═══ התחברות ═══
async function renderLogin(msg) {
  $('app').innerHTML = `<div class="login box">
    <h1>ניהול עמודי סטטוס</h1><p>MARK Automations</p>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <div class="f"><label for="nm">עורך</label><input id="nm" autocomplete="username"></div>
    <div class="f"><label for="pw">סיסמה</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="primary" id="go" style="width:100%;justify-content:center">כניסה</button></div>`;
  $('nm').focus();
  const go = async () => {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('nm').value, password: $('pw').value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return renderLogin(d.error || 'ההתחברות נכשלה');
    ME = d.editor; renderClients();
  };
  $('go').onclick = go;
  $('nm').onkeydown = e => { if (e.key === 'Enter') $('pw').focus(); };
  $('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

// ═══ לקוחות ═══
async function renderClients() {
  const list = await api('/api/admin/clients');
  $('app').innerHTML = `
    <div class="bar"><div><h1>לקוחות</h1><div class="who">מחובר כ${esc(ME)}</div></div>
      <div class="actions"><button class="primary" id="add">${svg(UI.plus)}לקוח חדש</button>
      <button id="out">${svg(UI.out)}יציאה</button></div></div>
    <div class="box"><div class="clients">${list.length ? list.map(c => {
      const p = c.item_count ? Math.round(c.done_count / c.item_count * 100) : 0;
      return `<div class="crow ${c.is_active ? '' : 'off'}">
        <div><strong>${esc(c.name)}</strong>
          <small>${c.item_count} נושאים, ${c.done_count} הושלמו${c.is_active ? '' : ', הקישור מושבת'}</small>
          <div class="bar-mini"><i style="width:${p}%"></i></div></div>
        <div class="actions">
          <button class="sm" data-copy="${esc(c.token)}">${svg(UI.copy)}העתק קישור</button>
          <a class="btn sm" href="/s/${esc(c.token)}" target="_blank" rel="noopener">${svg(UI.eye)}תצוגה</a>
          <button class="sm primary" data-edit="${c.id}">עריכה</button></div></div>`;
    }).join('') : '<div class="empty">אין עדיין לקוחות. הוסף לקוח כדי ליצור עבורו קישור.</div>'}</div></div>`;

  $('add').onclick = async () => {
    const name = prompt('שם הלקוח'); if (!name?.trim()) return;
    const c = await api('/api/admin/clients', { method: 'POST', body: JSON.stringify({ name }) });
    toast('הלקוח נוסף'); renderClient(c.id);
  };
  $('out').onclick = async () => { await api('/api/logout', { method: 'POST' }); ME = null; renderLogin(); };
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(publicUrl(b.dataset.copy)));
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => renderClient(b.dataset.edit));
}

// ═══ עריכת לקוח ═══
let OPEN = new Set();
async function renderClient(id) {
  let c;
  try { c = await api(`/api/admin/clients/${id}`); } catch { return renderClients(); }
  const { items, questions } = await api(`/api/admin/clients/${id}/items`);

  $('app').innerHTML = `
    <div class="bar"><div><button class="ghost" id="back">${svg(UI.back)}כל הלקוחות</button><h1>${esc(c.name)}</h1></div>
      <div class="actions"><a class="btn" href="/s/${esc(c.token)}" target="_blank" rel="noopener">${svg(UI.eye)}תצוגת לקוח</a>
      <button class="primary" id="newItem">${svg(UI.plus)}נושא חדש</button></div></div>

    <section class="box"><h2>פרטי העמוד</h2>
      <div class="g2"><div class="f"><label for="cName">שם</label><input id="cName" value="${esc(c.name)}"></div>
        <div class="f"><label for="cSub">שורת משנה</label><input id="cSub" value="${esc(c.subtitle || '')}" placeholder="מצב העבודה על המערכת"></div></div>
      <div class="g2"><div class="f"><label for="cVer">גרסה</label><input id="cVer" value="${esc(c.version || '1.0')}"></div>
        <div class="f"><label>קישור ללקוח</label><div class="linkbox"><input readonly value="${publicUrl(c.token)}">
          <button class="sm" id="cp">${svg(UI.copy)}</button></div></div></div>
      <div class="actions">
        <button class="primary" id="saveC">${svg(UI.save)}שמור פרטים</button>
        <button id="toggle">${c.is_active ? 'השבת קישור' : 'הפעל קישור'}</button>
        <button id="rotate">${svg(UI.refresh)}צור קישור חדש</button>
        <button class="danger" id="delC">${svg(UI.trash)}מחק לקוח</button></div>
    </section>

    <section class="box"><h2>נושאים</h2><div id="items">
      ${items.length ? items.map((it, i) => itemHTML(it, i, items.length)).join('') : '<div class="empty">אין נושאים. הוסף נושא ראשון.</div>'}
    </div></section>

    <section class="box"><h2>שאלות שמחכות ללקוח</h2><div id="qs">
      ${questions.map(qHTML).join('') || '<div class="empty">אין שאלות פתוחות</div>'}
    </div><button class="sm" id="newQ">${svg(UI.plus)}שאלה חדשה</button></section>`;

  $('back').onclick = () => { OPEN.clear(); renderClients(); };
  $('cp').onclick = () => copy(publicUrl(c.token));
  $('saveC').onclick = async () => {
    await api(`/api/admin/clients/${id}`, { method: 'PUT', body: JSON.stringify({ name: $('cName').value, subtitle: $('cSub').value, version: $('cVer').value }) });
    toast('הפרטים נשמרו'); renderClient(id);
  };
  $('toggle').onclick = async () => {
    await api(`/api/admin/clients/${id}`, { method: 'PUT', body: JSON.stringify({ is_active: !c.is_active }) });
    toast(c.is_active ? 'הקישור הושבת' : 'הקישור הופעל'); renderClient(id);
  };
  $('rotate').onclick = async () => {
    if (!confirm('הקישור הנוכחי יפסיק לעבוד. להמשיך?')) return;
    await api(`/api/admin/clients/${id}/rotate`, { method: 'POST' }); toast('נוצר קישור חדש'); renderClient(id);
  };
  $('delC').onclick = async () => {
    if (prompt(`כדי למחוק, הקלד את שם הלקוח: ${c.name}`) !== c.name) return;
    await api(`/api/admin/clients/${id}`, { method: 'DELETE' }); toast('הלקוח נמחק'); renderClients();
  };
  $('newItem').onclick = async () => {
    const it = await api('/api/admin/items', { method: 'POST', body: JSON.stringify({ client_id: id, title: 'נושא חדש' }) });
    OPEN.add(String(it.id)); renderClient(id);
  };
  $('newQ').onclick = async () => { await api('/api/admin/questions', { method: 'POST', body: JSON.stringify({ client_id: id, sort_order: questions.length }) }); renderClient(id); };
  wire(id, items);
}

function itemHTML(it, i, n) {
  const open = OPEN.has(String(it.id));
  return `<div class="item ${it.status}" data-id="${it.id}">
    <div class="ih">
      <button class="t" data-toggle aria-expanded="${open}">${svg((I[it.icon] || I.circle).p)}<span>${esc(it.title)}</span></button>
      <span class="st">${S[it.status].he}</span>
      <button class="ghost" data-move="-1" ${i === 0 ? 'disabled' : ''} aria-label="הזז למעלה">${svg(UI.up)}</button>
      <button class="ghost" data-move="1" ${i === n - 1 ? 'disabled' : ''} aria-label="הזז למטה">${svg(UI.down)}</button>
    </div>
    <div class="ib" ${open ? '' : 'hidden'}>
      <div class="f" style="margin-top:12px"><label>סטטוס</label><div class="segbtn">
        ${Object.entries(S).map(([k, v]) => `<button type="button" class="${k}" data-status="${k}" aria-pressed="${it.status === k}">${svg(v.p)}${v.he}</button>`).join('')}
      </div></div>
      <div class="f"><label>כותרת</label><input data-f="title" value="${esc(it.title)}"></div>
      <div class="f"><label>תיאור</label><textarea data-f="description" placeholder="משפט או שניים בשפה של הלקוח">${esc(it.description || '')}</textarea></div>
      <div class="g2"><div class="f"><label>אחראי</label><input data-f="owner" value="${esc(it.owner || '')}" placeholder="MARK"></div>
        <div class="f"><label>שלב או יעד</label><input data-f="stage" value="${esc(it.stage || '')}" placeholder="עד סוף החודש"></div></div>
      <div class="f"><label>מה עוצר את העבודה (השאר ריק אם אין)</label><input data-f="blocker" value="${esc(it.blocker || '')}"></div>
      <div class="f"><label>אייקון</label><div class="icons">
        ${Object.entries(I).map(([k, v]) => `<button type="button" data-ico="${k}" aria-pressed="${it.icon === k}">${svg(v.p)}${v.he}</button>`).join('')}
      </div></div>
      <div class="f"><label>שלבים</label><div data-bullets>${(it.bullets || []).map(bulletHTML).join('')}</div>
        <button class="sm" type="button" data-addb>${svg(UI.plus)}הוסף שלב</button></div>
      <div class="actions"><button class="primary" data-save>${svg(UI.save)}שמור נושא</button>
        <button class="danger" data-del>${svg(UI.trash)}מחק נושא</button></div>
    </div></div>`;
}
const bulletHTML = (x = { text: '', done: false }) => `<div class="bl">
  <input type="checkbox" ${x.done ? 'checked' : ''} aria-label="הושלם">
  <input type="text" value="${esc(x.text)}" placeholder="תיאור השלב">
  <button class="ghost" type="button" data-rmb aria-label="הסר שלב">${svg(UI.x)}</button></div>`;
const qHTML = q => `<div class="item" data-qid="${q.id}"><div class="ib">
  <div class="f" style="margin-top:12px"><label>שאלה</label><input data-qf="title" value="${esc(q.title)}"></div>
  <div class="f"><label>פירוט</label><textarea data-qf="body">${esc(q.body || '')}</textarea></div>
  <div class="actions"><button class="primary sm" data-qsave>${svg(UI.save)}שמור שאלה</button>
  <button class="danger sm" data-qdel>${svg(UI.trash)}מחק שאלה</button></div></div></div>`;

function wire(clientId, items) {
  document.querySelectorAll('.item[data-id]').forEach(el => {
    const id = el.dataset.id;
    el.querySelector('[data-toggle]').onclick = e => {
      const body = el.querySelector('.ib'); body.hidden = !body.hidden;
      e.currentTarget.setAttribute('aria-expanded', !body.hidden);
      body.hidden ? OPEN.delete(id) : OPEN.add(id);
    };
    el.querySelectorAll('[data-move]').forEach(b => b.onclick = async () => {
      const ids = items.map(x => String(x.id)); const i = ids.indexOf(id); const j = i + Number(b.dataset.move);
      [ids[i], ids[j]] = [ids[j], ids[i]];
      await api(`/api/admin/clients/${clientId}/reorder`, { method: 'POST', body: JSON.stringify({ ids }) });
      renderClient(clientId);
    });
    el.querySelectorAll('[data-status]').forEach(b => b.onclick = () =>
      el.querySelectorAll('[data-status]').forEach(x => x.setAttribute('aria-pressed', x === b)));
    el.querySelectorAll('[data-ico]').forEach(b => b.onclick = () =>
      el.querySelectorAll('[data-ico]').forEach(x => x.setAttribute('aria-pressed', x === b)));
    el.querySelector('[data-addb]').onclick = () => {
      el.querySelector('[data-bullets]').insertAdjacentHTML('beforeend', bulletHTML());
      el.querySelector('[data-bullets] .bl:last-child input[type=text]').focus();
    };
    el.querySelector('[data-bullets]').onclick = e => { const r = e.target.closest('[data-rmb]'); if (r) r.parentElement.remove(); };
    el.querySelector('[data-save]').onclick = async () => {
      const g = f => el.querySelector(`[data-f="${f}"]`).value;
      const bullets = [...el.querySelectorAll('[data-bullets] .bl')].map(x => ({
        text: x.querySelector('input[type=text]').value.trim(), done: x.querySelector('input[type=checkbox]').checked,
      })).filter(x => x.text);
      await api(`/api/admin/items/${id}`, { method: 'PUT', body: JSON.stringify({
        title: g('title'), description: g('description'), owner: g('owner'), stage: g('stage'), blocker: g('blocker'),
        status: el.querySelector('[data-status][aria-pressed=true]').dataset.status,
        icon: el.querySelector('[data-ico][aria-pressed=true]')?.dataset.ico || 'circle', bullets,
      }) });
      toast('הנושא נשמר'); renderClient(clientId);
    };
    el.querySelector('[data-del]').onclick = async () => {
      if (!confirm('למחוק את הנושא?')) return;
      await api(`/api/admin/items/${id}`, { method: 'DELETE' }); OPEN.delete(id); toast('הנושא נמחק'); renderClient(clientId);
    };
  });
  document.querySelectorAll('.item[data-qid]').forEach(el => {
    const id = el.dataset.qid;
    el.querySelector('[data-qsave]').onclick = async () => {
      await api(`/api/admin/questions/${id}`, { method: 'PUT', body: JSON.stringify({
        title: el.querySelector('[data-qf="title"]').value, body: el.querySelector('[data-qf="body"]').value }) });
      toast('השאלה נשמרה');
    };
    el.querySelector('[data-qdel]').onclick = async () => { await api(`/api/admin/questions/${id}`, { method: 'DELETE' }); renderClient(clientId); };
  });
}

(async () => {
  const me = await fetch('/api/me').then(r => r.json()).catch(() => ({}));
  if (me.editor) { ME = me.editor; renderClients(); } else renderLogin();
})();
</script>
</body>
</html>
